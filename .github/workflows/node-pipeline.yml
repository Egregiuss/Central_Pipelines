name: Node.js Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      gar-repository:
        type: string
        required: true
      image-name:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      cloud-run-port:
        type: number
        default: 8080
      cloud-sql-instances:
        type: string
        default: ''
      cloud-run-env-vars:
        type: string
        default: ''
    secrets:
      GCP_REGION:
        required: true
      GCP_SA_KEY:
        required: true
      GCP_PROJECT_ID:
        required: true
      CLOUD_RUN_SERVICE:
        required: true
      BACKSTAGE_BASE_URL:
        required: false
      POSTGRES_HOST:
        required: false
      POSTGRES_PORT:
        required: false
      POSTGRES_USER:
        required: false
      POSTGRES_PASSWORD_SECRET_NAME:
        required: false

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc

      - name: Test
        run: yarn test --watch=false

      - name: Build all packages
        run: yarn build:all

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Audit dependencies
        run: yarn npm audit --severity high

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Run ESLint security checks
        run: yarn lint:all

  deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type check
        run: yarn tsc

      - name: Build all packages
        run: yarn build:all

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${{ inputs.gar-repository }}" \
            --location="${{ secrets.GCP_REGION }}" \
          || gcloud artifacts repositories create "${{ inputs.gar-repository }}" \
            --repository-format=docker \
            --location="${{ secrets.GCP_REGION }}" \
            --description="Docker images for ${{ inputs.gar-repository }}"

      - name: Build Docker image
        run: |
          docker build . \
            --file ${{ inputs.dockerfile }} \
            --tag "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:${{ github.sha }}" \
            --tag "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:latest"

      - name: Push Docker image
        run: |
          docker push "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:${{ github.sha }}"
          docker push "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:latest"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:${{ github.sha }}"
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --image="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:${{ github.sha }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=${{ inputs.cloud-run-port }} \
            ${{ inputs.cloud-sql-instances != '' && format('--add-cloudsql-instances="{0}"', inputs.cloud-sql-instances) || '' }} \
            ${{ inputs.cloud-run-env-vars != '' && format('--set-env-vars="{0}"', inputs.cloud-run-env-vars) || '' }} \
            --set-secrets="POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_SECRET_NAME }}:latest"
