name: Node Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      gar-repository:
        type: string
        required: true
      image-name:
        type: string
        required: true
      dockerfile:
        type: string
        default: Dockerfile
      cloud-run-port:
        type: number
        default: 8080
      cloud-sql-instances:
        type: string
        default: ''
      cloud-run-env-vars:
        type: string
        default: ''
        # Base env vars (no secrets). Secret-based vars are appended automatically.
    secrets:
      GCP_REGION:
        required: true
      GCP_SA_KEY:
        required: true
      GCP_PROJECT_ID:
        required: true
      CLOUD_RUN_SERVICE:
        required: true
      POSTGRES_PASSWORD_SECRET_NAME:
        required: false
      BACKSTAGE_BASE_URL:
        required: false
      POSTGRES_HOST:
        required: false
      POSTGRES_PORT:
        required: false
      POSTGRES_USER:
        required: false

jobs:
  deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build:all

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${{ inputs.gar-repository }}" \
            --location="${{ secrets.GCP_REGION }}" \
          || gcloud artifacts repositories create "${{ inputs.gar-repository }}" \
            --repository-format=docker \
            --location="${{ secrets.GCP_REGION }}" \
            --description="Docker images for ${{ inputs.gar-repository }}"

      - name: Build Docker image
        run: |
          docker build . \
            --file ${{ inputs.dockerfile }} \
            --tag "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:${{ github.sha }}" \
            --tag "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:latest"

      - name: Push Docker image
        run: |
          docker push "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:${{ github.sha }}"
          docker push "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:latest"

      - name: Build env vars string
        id: envvars
        run: |
          ENV_VARS="${{ inputs.cloud-run-env-vars }}"
          [ -n "${{ secrets.BACKSTAGE_BASE_URL }}" ] && ENV_VARS="${ENV_VARS},BACKSTAGE_BASE_URL=${{ secrets.BACKSTAGE_BASE_URL }}"
          [ -n "${{ secrets.POSTGRES_HOST }}" ]      && ENV_VARS="${ENV_VARS},POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}"
          [ -n "${{ secrets.POSTGRES_PORT }}" ]      && ENV_VARS="${ENV_VARS},POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}"
          [ -n "${{ secrets.POSTGRES_USER }}" ]      && ENV_VARS="${ENV_VARS},POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
          ENV_VARS="${ENV_VARS#,}"
          echo "value=${ENV_VARS}" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --image="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ inputs.gar-repository }}/${{ inputs.image-name }}:${{ github.sha }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=${{ inputs.cloud-run-port }} \
            ${{ inputs.cloud-sql-instances != '' && format('--add-cloudsql-instances="{0}"', inputs.cloud-sql-instances) || '' }} \
            ${{ steps.envvars.outputs.value != '' && format('--set-env-vars="{0}"', steps.envvars.outputs.value) || '' }} \
            --set-secrets="POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD_SECRET_NAME }}:latest"
